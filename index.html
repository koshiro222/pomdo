<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1013" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pomdo｜ひとつずつ、前に進める。</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Manrope', sans-serif;
        text-align: center;
        padding: 20px;
      ">
        <div>
          <h1 style="font-size: 24px; margin-bottom: 16px;">JavaScriptを有効にしてください</h1>
          <p style="font-size: 16px; color: #94a3b8;">PomdoはJavaScriptを必要とします</p>
        </div>
      </div>
    </noscript>
    <script>
      const theme = localStorage.getItem('pomdo-theme');
      const daisyTheme = theme === 'light' ? 'cmyk' : theme === 'dark' ? 'sunset' : null;
      if (daisyTheme) document.documentElement.dataset.theme = daisyTheme;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

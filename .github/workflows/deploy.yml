name: Production deploy

on:
  push:
    branches: [main]

concurrency:
  group: pomdo-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality-gate.yml
    with:
      checkout-ref: ${{ github.sha }}
      checks-environment: e2e
      build-environment: production

  deploy:
    name: Deploy to Production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download verified build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.quality.outputs['build-artifact-name'] }}
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pomdo --branch=main --commit-hash=${{ github.sha }}

      - name: Write deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo '## Production deploy'
            echo
            echo "- commit: `${GITHUB_SHA}`"
            echo "- deployment URL: ${DEPLOYMENT_URL}"
            echo "- alias URL: ${ALIAS_URL:-https://pomdo.pages.dev}"
          } >> "$GITHUB_STEP_SUMMARY"

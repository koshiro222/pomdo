name: E2E quality gate

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Validate workflow ref
    runs-on: ubuntu-latest
    steps:
      - name: Reject untrusted manual ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            exit 0
          fi
          if [ "$REF" != "refs/heads/main" ] && [ "$REF" != "refs/heads/develop" ]; then
            echo 'workflow_dispatchはmainまたはdevelopからだけ実行できます。'
            exit 1
          fi

  environment-secrets-probe:
    name: Probe e2e-pr secrets
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      name: e2e-pr
      deployment: false
    steps:
      - name: Validate secret availability without logging values
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          set -eu
          test -n "$E2E_DATABASE_URL"
          test -n "$BETTER_AUTH_SECRET"
          test -n "$TURNSTILE_SECRET_KEY"
          test -n "$TURNSTILE_SITE_KEY"
          echo 'e2e-pr environment secrets are available'

  quality:
    name: Quality gate
    needs: guard
    uses: ./.github/workflows/quality-gate.yml
    with:
      checkout-ref: ${{ github.sha }}
      checks-environment: ${{ github.event_name == 'pull_request' && 'e2e-pr' || 'e2e' }}
      build-environment: ${{ github.event_name == 'pull_request' && 'e2e-pr' || 'e2e' }}

name: Quality gate

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string
      checks-environment:
        required: true
        type: string
      build-environment:
        required: true
        type: string
    outputs:
      build-artifact-name:
        description: 同一commitのbuild Artifact名
        value: ${{ jobs['build-e2e'].outputs.build_artifact_name || jobs['build-e2e-pr'].outputs.build_artifact_name || jobs['build-preview'].outputs.build_artifact_name || jobs['build-production'].outputs.build_artifact_name }}

jobs:
  checks-e2e:
    name: Checks
    if: ${{ inputs.checks-environment == 'e2e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pomdo-e2e-${{ github.repository }}
      cancel-in-progress: false
    environment: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Run quality checks
        uses: ./.github/actions/run-quality-checks
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

  checks-e2e-pr:
    name: Checks
    if: ${{ inputs.checks-environment == 'e2e-pr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pomdo-e2e-${{ github.repository }}
      cancel-in-progress: false
    environment: e2e-pr
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Run quality checks
        uses: ./.github/actions/run-quality-checks
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

  build-e2e:
    name: Build (e2e)
    if: ${{ always() && inputs.build-environment == 'e2e' && (needs['checks-e2e'].result == 'success' || needs['checks-e2e-pr'].result == 'success') }}
    needs: [checks-e2e, checks-e2e-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: e2e
    outputs:
      build_artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Build distribution
        id: build
        uses: ./.github/actions/build-dist
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  build-e2e-pr:
    name: Build (e2e-pr)
    if: ${{ always() && inputs.build-environment == 'e2e-pr' && (needs['checks-e2e'].result == 'success' || needs['checks-e2e-pr'].result == 'success') }}
    needs: [checks-e2e, checks-e2e-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: e2e-pr
    outputs:
      build_artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Build distribution
        id: build
        uses: ./.github/actions/build-dist
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  build-preview:
    name: Build (preview)
    if: ${{ always() && inputs.build-environment == 'preview' && (needs['checks-e2e'].result == 'success' || needs['checks-e2e-pr'].result == 'success') }}
    needs: [checks-e2e, checks-e2e-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    outputs:
      build_artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Build distribution
        id: build
        uses: ./.github/actions/build-dist
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  build-production:
    name: Build (production)
    if: ${{ always() && inputs.build-environment == 'production' && (needs['checks-e2e'].result == 'success' || needs['checks-e2e-pr'].result == 'success') }}
    needs: [checks-e2e, checks-e2e-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      build_artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Build distribution
        id: build
        uses: ./.github/actions/build-dist
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

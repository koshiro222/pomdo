name: Run Chromium E2E checks
description: E2E環境とChromiumを準備し、共有DBを使うE2Eと成果物保存を実行する

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Initialize timing summary
      shell: bash
      run: |
        {
          echo '### E2E処理の所要時間'
          echo
          echo '| 処理 | 所要時間（秒） | 終了コード |'
          echo '| --- | ---: | ---: |'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Install dependencies
      shell: bash
      run: |
        started=$SECONDS
        if npm ci; then
          status=0
        else
          status=$?
        fi
        elapsed=$((SECONDS - started))
        printf '| npm ci | %s | %s |\n' "$elapsed" "$status" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: Prepare E2E environment
      shell: bash
      run: |
        set -eu
        test -n "$DATABASE_URL"
        test -n "$BETTER_AUTH_SECRET"
        umask 077
        {
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
          printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
          printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
          printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
          printf 'BETTER_AUTH_URL=http://localhost:5173\n'
          printf 'FRONTEND_URL=http://localhost:5173\n'
          printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
          printf 'E2E_TEST_MODE=true\n'
          printf 'SENTRY_DSN=\n'
        } > .dev.vars

    - name: Install Playwright Browsers
      shell: bash
      run: |
        started=$SECONDS
        if npx playwright install --with-deps chromium; then
          status=0
        else
          status=$?
        fi
        elapsed=$((SECONDS - started))
        printf '| Playwrightブラウザー導入 | %s | %s |\n' "$elapsed" "$status" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: Run Chromium E2E
      shell: bash
      run: |
        started=$SECONDS
        if npm run test:e2e -- --project=chromium --workers=2; then
          status=0
        else
          status=$?
        fi
        elapsed=$((SECONDS - started))
        printf '| Chromium E2E | %s | %s |\n' "$elapsed" "$status" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: Assert Playwright report
      shell: bash
      run: |
        started=$SECONDS
        if npm run test:e2e:assert; then
          status=0
        else
          status=$?
        fi
        elapsed=$((SECONDS - started))
        printf '| Playwrightレポート検証 | %s | %s |\n' "$elapsed" "$status" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: Remove E2E secrets file
      if: always()
      shell: bash
      run: rm -f .dev.vars

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.sha }}
        path: playwright-report/
        if-no-files-found: warn
        retention-days: 30

    - name: Upload Playwright results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results-${{ github.sha }}
        path: test-results/
        if-no-files-found: warn
        retention-days: 30
